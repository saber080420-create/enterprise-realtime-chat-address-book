<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="#409EFF" />
  
  <!-- 内部图形 -->
  <g fill="#FFFFFF">
    <!-- 中心建筑图标 -->
    <path d="M100 40 L140 70 L140 150 L60 150 L60 70 Z" />
    
    <!-- 门 -->
    <rect x="90" y="120" width="20" height="30" fill="#409EFF" />
    
    <!-- 窗户 -->
    <rect x="75" y="80" width="15" height="15" fill="#409EFF" />
    <rect x="110" y="80" width="15" height="15" fill="#409EFF" />
    
    <!-- 屋顶 -->
    <path d="M100 30 L150 70 L50 70 Z" fill="#409EFF" />
  </g>
  
  <!-- 人物图标 -->
  <g transform="translate(30, 90) scale(0.5)">
    <!-- 头部 -->
    <circle cx="50" cy="30" r="20" fill="#FFFFFF" />
    
    <!-- 身体 -->
    <path d="M50 50 L50 100 M30 70 L70 70 M50 100 L30 130 M50 100 L70 130" stroke="#FFFFFF" stroke-width="8" fill="none" />
  </g>
  
  <!-- 人物图标 -->
  <g transform="translate(120, 90) scale(0.5)">
    <!-- 头部 -->
    <circle cx="50" cy="30" r="20" fill="#FFFFFF" />
    
    <!-- 身体 -->
    <path d="M50 50 L50 100 M30 70 L70 70 M50 100 L30 130 M50 100 L70 130" stroke="#FFFFFF" stroke-width="8" fill="none" />
  </g>
  
  <!-- 连接线 -->
  <path d="M65 110 L135 110" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="5,5" />
</svg>